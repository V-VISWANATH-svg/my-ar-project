<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Magic AR Frame</title>
  
  <!-- A-Frame and MindAR libraries -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }

    /* Premium Glassmorphism UI Overlay */
    #overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.9) 0%, rgba(2, 6, 23, 0.98) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      transition: opacity 0.5s ease;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transform: translateY(0);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn-start {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border: none;
      color: white;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      transition: all 0.3s ease;
      outline: none;
      letter-spacing: 0.5px;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(139, 92, 246, 0.5);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    /* Scanning animation overlay (Only visible when AR is active) */
    #scanner-guide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .scan-box {
      width: 280px;
      height: 380px;
      border: 3px solid rgba(59, 130, 246, 0.5);
      border-radius: 20px;
      position: relative;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
    }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, #3b82f6, transparent);
      box-shadow: 0 0 15px #8b5cf6;
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    .scan-text {
      color: #fff;
      margin-top: 20px;
      font-size: 1rem;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
  </style>

  <!-- CRITICAL: A-Frame components MUST be registered in the <head> before <a-scene> is parsed -->
  <script>
    // --- MANUAL CONFIGURATION OVERRIDE ---
    // Height / Width aspect ratio of your target photo
    // Example: For a standard vertical photo, use 1.4 or 1.5. Set to null for auto-detect.
    const MANUAL_ASPECT_RATIO = 1.4;

    AFRAME.registerComponent('video-handler', {
      init: function () {
        const marker = this.el;
        const video = document.querySelector('#ar-video');
        const aVideo = marker.querySelector('a-video');
        const scannerGuide = document.querySelector('#scanner-guide');
        const debugLog = document.querySelector('#debug-log');

        function log(msg) {
          console.log("[AR Debug]", msg);
          if (debugLog) {
            debugLog.style.display = 'block';
            debugLog.innerHTML += msg + '<br>';
          }
        }

        // Target Found
        marker.addEventListener('targetFound', () => {
          log("Image Target Detected!");
          
          try {
            let aspect = MANUAL_ASPECT_RATIO;
            
            if (!aspect) {
              log("Attempting automatic aspect ratio detection...");
              const sceneEl = document.querySelector('a-scene');
              const arSystem = sceneEl.systems["mindar-image-system"];
              if (arSystem && arSystem.controller) {
                const targetAttr = marker.getAttribute('mindar-image-target');
                const match = targetAttr.match(/targetIndex:\s*(\d+)/);
                const targetIndex = match ? parseInt(match[1]) : 0;
                
                function findDimensions(obj, depth = 0) {
                  if (!obj || depth > 3) return null;
                  let foundW = obj.width || obj.w;
                  let foundH = obj.height || obj.h;
                  if (foundW && foundH) return { width: foundW, height: foundH };
                  
                  for (const key in obj) {
                    if (typeof obj[key] === 'object' && obj[key] !== null) {
                      const res = findDimensions(obj[key], depth + 1);
                      if (res) return res;
                    }
                  }
                  return null;
                }

                const controller = arSystem.controller;
                let targetsList = controller.targets || controller.imageTargets;
                if (!targetsList) {
                  for (const key in controller) {
                    if (key.toLowerCase().includes("target") && Array.isArray(controller[key])) {
                      targetsList = controller[key];
                      break;
                    }
                  }
                }
                
                if (targetsList && targetsList[targetIndex]) {
                  const dims = findDimensions(targetsList[targetIndex]);
                  if (dims) {
                    aspect = dims.height / dims.width;
                    log(`Auto-detected target dimensions: ${dims.width}x${dims.height}, Aspect: ${aspect}`);
                  }
                }
              }
            }

            if (aspect) {
              log(`Applying Aspect Ratio: ${aspect}`);
              // Set attributes
              aVideo.setAttribute('width', '1');
              aVideo.setAttribute('height', aspect.toString());
              
              // Force update A-Frame geometry component
              aVideo.setAttribute('geometry', {
                primitive: 'plane',
                width: 1,
                height: aspect
              });
            } else {
              log("Warning: Aspect ratio detection failed, using fallback 0.5625");
            }
          } catch (e) {
            log("Error setting aspect ratio: " + e.message);
          }

          if (video) video.play();
          if (scannerGuide) scannerGuide.style.display = 'none'; // Hide scanning guide
        });

        // Target Lost
        marker.addEventListener('targetLost', () => {
          log("Image Target Lost!");
          if (video) video.pause();
          if (scannerGuide) scannerGuide.style.display = 'flex'; // Show scanning guide again
        });
      }
    });
  </script>
</head>
<body>

  <!-- Premium Overlay Screen for Audio Unmute Activation -->
  <div id="overlay-container">
    <div class="card">
      <h1>Magic AR Frame</h1>
      <p>Camera permission-ஐ allow செய்யவும். பின் Frame-ல் உள்ள Photo-ஐ scan செய்யவும்.</p>
      <button class="btn-start" id="btn-start">START EXPERIENCE</button>
    </div>
  </div>

  <!-- Camera Scanning Guide -->
  <div id="scanner-guide">
    <div class="scan-box">
      <div class="scan-line"></div>
    </div>
    <div class="scan-text">Photo-ஐ கேமரா நேராக காட்டவும்</div>
  </div>

  <!-- On-Screen Debug Info (Helps troubleshoot caching & dimension detection) -->
  <div id="debug-log" style="position: absolute; bottom: 10px; left: 10px; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.7); padding: 8px 12px; font-size: 10px; z-index: 10000; font-family: monospace; border-radius: 8px; pointer-events: none; max-width: 80%; display: none;"></div>

  <!-- AR Scene Setup (autoStart set to false so it waits for click to trigger browser permission) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF:0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Target Video File (Must be local video.mp4 in GitHub Repo) -->
      <video 
        id="ar-video" 
        src="./video.mp4" 
        preload="auto" 
        loop="true" 
        crossorigin="anonymous"
        playsinline 
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AR Target (index 0 corresponds to the compiled photo in targets.mind) -->
    <a-entity mindar-image-target="targetIndex: 0" video-handler>
      <!-- Aspect ratio will be updated dynamically via JS -->
      <a-video 
        src="#ar-video" 
        width="1" 
        height="0.5625" 
        position="0 0 0" 
        rotation="0 0 0">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById('btn-start');
    const overlay = document.getElementById('overlay-container');
    const scannerGuide = document.getElementById('scanner-guide');
    const sceneEl = document.querySelector('a-scene');
    const debugLog = document.getElementById('debug-log');

    function log(msg) {
      console.log("[AR Debug]", msg);
      if (debugLog) {
        debugLog.style.display = 'block';
        debugLog.innerHTML += msg + '<br>';
      }
    }

    log("App initialized - v1.8");

    startBtn.addEventListener('click', () => {
      // Unlock mobile browser audio constraints
      const video = document.getElementById('ar-video');
      if (video) {
        video.play().then(() => {
          video.pause();
          log("Audio unlocked successfully.");
        }).catch(err => {
          log("Audio unlock failed: " + err.message);
        });
      }

      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
        if (scannerGuide) scannerGuide.style.display = 'flex';
      }, 500);

      // Start the MindAR camera tracking manually inside user gesture (resolves black screen)
      try {
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) {
          // Mock the UI if it's undefined to prevent library crash on "uiLoading: no"
          if (!arSystem.ui) {
            log("UI is undefined. Mocking UI to prevent crash.");
            arSystem.ui = {
              showLoading: () => log("UI: showLoading (mock)"),
              hideLoading: () => log("UI: hideLoading (mock)"),
              showScanning: () => log("UI: showScanning (mock)"),
              hideScanning: () => log("UI: hideScanning (mock)"),
              showError: () => log("UI: showError (mock)"),
              hideError: () => log("UI: hideError (mock)")
            };
          }
          
          arSystem.start();
          log("AR tracking started successfully.");
        } else {
          log("Error: AR System not found.");
        }
      } catch (err) {
        log("AR Start Error: " + err.message);
      }
    });
  </script>
</body>
</html>
